
name: Build DonutClientHelper

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Extract source archive
        run: |
          unzip -q "DonutClientHelper-1.21.11-source (1).zip" -d source

      - name: Build Minecraft mod
        run: |
          PROJECT="$(dirname "$(find source -name settings.gradle -o -name settings.gradle.kts | head -n 1)")"
          test -n "$PROJECT"
          cd "$PROJECT"
          gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DonutClientHelper-JAR
          path: source/**/build/libs/*.jar
          if-no-files-found: error
          
