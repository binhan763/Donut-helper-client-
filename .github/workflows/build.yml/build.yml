
name: Build DonutClientHelper

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract source ZIP
        run: |
          unzip -q DonutClientHelper-1.21.11-source.zip -d source
          find source -name settings.gradle -print

      - name: Build mod
        run: |
          cd source/DonutClientHelper-1.21.11
          gradle --no-daemon clean build

      - uses: actions/upload-artifact@v4
        with:
          name: DonutClientHelper-JAR
          path: source/DonutClientHelper-1.21.11/build/libs/*.jar
          if-no-files-found: error
